# Render Blueprint for the FastAPI backend (the frontend deploys to Vercel).
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*" # tighten to your Vercel URL, e.g. https://duolingo-clone.vercel.app
      - key: ENABLE_DEV_TOOLS
        value: "true"
